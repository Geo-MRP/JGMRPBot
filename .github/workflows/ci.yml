name: JGMRP Build and Test

# 1. THE TRIGGERS: When should this robot run?
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    # 2. THE ENVIRONMENT: Spin up a fresh Linux server
    runs-on: ubuntu-latest

    steps:
      # Grab your repository's code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Java 21
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven # This caches your dependencies so builds are blazingly fast

      # 3. THE EXECUTION: Run your strict rules

      # Step A: Did they format their code?
      - name: Check Formatting (Spotless)
        run: mvn spotless:check

      # Step B: Does the logic pass Checkstyle and do the tests work?
      - name: Build, Lint, and Test
        run: mvn clean install